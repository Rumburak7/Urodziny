<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wszystkiego najlepszego!</title>
<meta property="og:title" content="🎂 Życzenia urodzinowe">
<meta property="og:description" content="Mam coś dla Ciebie - otwórz!">
<style>
:root{--bg1:#2a1b4d;--bg2:#5b2a6e;--ink:#fff;--soft:#f3e9ff;--acc:#ffd166;--pink:#ff6b9a;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.25)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
#konfetti{position:fixed;inset:0;pointer-events:none;z-index:3}
.balon{position:fixed;bottom:-140px;width:60px;height:76px;border-radius:50% 50% 48% 48%;opacity:.85;z-index:1;animation:lec linear infinite}
.balon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:60px;background:rgba(255,255,255,.5)}
@keyframes lec{to{transform:translate(var(--dx),-130vh) rotate(var(--r))}}
main{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:28px 16px 40px;text-align:center}
h1{font-size:clamp(30px,8vw,52px);line-height:1.15;margin:8px 0 4px;text-shadow:0 3px 12px rgba(0,0,0,.35)}
h1 .imie{color:var(--acc);display:block}
.wiek{font-size:20px;color:var(--soft);margin:0 0 6px}
.tort{width:min(300px,80vw);margin:6px auto 0;display:block;cursor:pointer;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.plomien{transform-origin:50% 100%;animation:migaj .5s ease-in-out infinite alternate}
@keyframes migaj{from{transform:scale(1,1)}to{transform:scale(.85,1.12) translateY(-1px)}}
.zgaszone .plomien{display:none}.zgaszone .dym{display:block}.dym{display:none;animation:dym 1.6s ease-out forwards}
@keyframes dym{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
.podpis{font-size:14px;color:var(--soft);margin:2px 0 14px}
.zyczenia{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;font-size:19px;margin:10px 0 16px;backdrop-filter:blur(4px);white-space:pre-line}
.od{font-size:20px;color:var(--acc);font-weight:700}
.przyciski{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
button,.btn{font:inherit;font-size:16px;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);text-decoration:none;display:inline-block}
button.drugi,.btn.drugi{background:rgba(255,255,255,.16);border:1px solid var(--line)}
/* generator */
.gen{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.gen label{display:block;font-size:14px;color:var(--soft);margin:12px 0 4px}
.gen input,.gen textarea,.gen select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff}
.gen textarea{min-height:90px;resize:vertical}
.gen small{color:var(--soft);font-size:13px}
.link{word-break:break-all;background:rgba(0,0,0,.3);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.wiersz{display:flex;gap:10px}.wiersz>div{flex:1}
footer{font-size:12px;color:rgba(255,255,255,.55);margin-top:26px}
.ukryj{display:none!important}
</style>
</head>
<body>
<canvas id="konfetti"></canvas>
<main>
  <!-- ===== ZYCZENIA (gdy w linku jest imie) ===== -->
  <section id="kartka" class="ukryj">
    <h1><span id="naglowek">Wszystkiego najlepszego</span><span class="imie" id="imie"></span></h1>
    <p class="wiek" id="wiek"></p>
    <svg class="tort" id="tort" viewBox="0 0 300 230" role="img" aria-label="Tort urodzinowy">
      <ellipse cx="150" cy="212" rx="130" ry="12" fill="rgba(0,0,0,.25)"/>
      <rect x="40" y="130" width="220" height="78" rx="12" fill="#f7a8c4"/>
      <path d="M40 140 q18 22 36 0 q18 22 37 0 q18 22 37 0 q18 22 37 0 q18 22 36 0 q18 22 37 0 v-10 h-220z" fill="#fff4f8"/>
      <rect x="40" y="186" width="220" height="10" fill="#e98bb0"/>
      <rect x="70" y="92" width="160" height="48" rx="10" fill="#ffd9a0"/>
      <path d="M70 100 q13 16 27 0 q13 16 26 0 q13 16 27 0 q13 16 27 0 q13 16 26 0 q13 16 27 0 v-8 h-160z" fill="#fff"/>
      <g id="swieczki"></g>
    </svg>
    <p class="podpis" id="podpisTort">Dotknij tortu, żeby zdmuchnąć świeczki 🎂</p>
    <div class="zyczenia" id="tekst"></div>
    <div class="od" id="od"></div>
    <div class="przyciski">
      <button id="graj">🎵 Muzyka</button>
      <button class="drugi" id="znowu">🎉 Jeszcze raz</button>
    </div>
  </section>

  <!-- ===== GENERATOR (gdy link bez imienia) ===== -->
  <section id="generator" class="ukryj">
    <h1>🎂 Życzenia<span class="imie">urodzinowe</span></h1>
    <p class="podpis">Wpisz imię, wyślij link - reszta dzieje się sama.</p>
    <div class="gen">
      <label for="gImie">Imię (tak, jak w życzeniach, np. „Aniu”, „Tomku”, „Kasia”)</label>
      <input id="gImie" maxlength="40" placeholder="np. Aniu">
      <div class="wiersz">
        <div><label for="gWiek">Ile lat? (nie musisz)</label><input id="gWiek" type="number" min="1" max="120" placeholder="—"></div>
        <div><label for="gJezyk">Język</label><select id="gJezyk"><option value="pl">Polski</option><option value="de">Deutsch</option></select></div>
      </div>
      <label for="gOd">Od kogo</label>
      <input id="gOd" maxlength="40" value="Adam">
      <label for="gTekst">Własne życzenia (zostaw puste = gotowe życzenia)</label>
      <textarea id="gTekst" maxlength="600"></textarea>
      <small>Gotowe życzenia dopasują się do wybranego języka.</small>
      <div class="przyciski">
        <button id="gPodglad" class="drugi">👀 Podgląd</button>
        <button id="gKopiuj">📋 Kopiuj link</button>
        <a id="gWhatsapp" class="btn" target="_blank" rel="noopener" style="background:#25d366">WhatsApp</a>
      </div>
      <div class="link" id="gLink"></div>
    </div>
  </section>
  <footer>Życzenia urodzinowe - autor Adam Bryks 2026</footer>
</main>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const P = new URLSearchParams(location.search);

  const TEKSTY = {
    pl: { nag: 'Wszystkiego najlepszego', wiek: (n) => 'Dziś kończysz ' + (n === 1 ? 'roczek' : n + ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? ' lata' : ' lat')) + '! 🎈',
          tort: 'Dotknij tortu, żeby zdmuchnąć świeczki 🎂', zgas: 'Brawo! Pomyśl życzenie ✨', od: 'Ściskam - ', muz: '🎵 Muzyka', znowu: '🎉 Jeszcze raz',
          domyslne: 'Z okazji urodzin życzę Ci przede wszystkim zdrowia,\nmnóstwa radości i uśmiechu na co dzień,\nludzi, na których zawsze możesz liczyć,\ni spełnienia wszystkich marzeń - tych małych i tych dużych.\n\nSto lat, sto lat! 🥳', tytul: 'Wszystkiego najlepszego' },
    de: { nag: 'Alles Gute zum Geburtstag', wiek: (n) => 'Heute wirst du ' + n + '! 🎈',
          tort: 'Tippe auf die Torte, um die Kerzen auszupusten 🎂', zgas: 'Super! Jetzt was wünschen ✨', od: 'Liebe Grüße - ', muz: '🎵 Musik', znowu: '🎉 Nochmal',
          domyslne: 'Zum Geburtstag wünsche ich Dir vor allem Gesundheit,\nviel Freude und jeden Tag einen Grund zum Lächeln,\nMenschen, auf die Du Dich immer verlassen kannst,\nund dass all Deine Wünsche in Erfüllung gehen - die kleinen und die großen.\n\nFeier schön! 🥳', tytul: 'Alles Gute zum Geburtstag' }
  };

  // ---------- konfetti ----------
  const cv = $('konfetti'), cx = cv.getContext('2d'); let kaw = [], anim = 0;
  function rozmiar() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', rozmiar); rozmiar();
  const KOL = ['#ffd166', '#ff6b9a', '#06d6a0', '#4cc9f0', '#f72585', '#ffffff', '#b388ff'];
  function konfetti(ile) {
    const d = devicePixelRatio;
    for (let i = 0; i < ile; i++) kaw.push({ x: Math.random() * cv.width, y: -20 * d - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 2 * d, vy: (2 + Math.random() * 3) * d,
      w: (6 + Math.random() * 6) * d, h: (8 + Math.random() * 8) * d, a: Math.random() * 6, va: (Math.random() - .5) * .3, k: KOL[(Math.random() * KOL.length) | 0] });
    if (!anim) anim = requestAnimationFrame(rysuj);
  }
  function rysuj() {
    cx.clearRect(0, 0, cv.width, cv.height);
    kaw = kaw.filter(p => p.y < cv.height + 40);
    for (const p of kaw) { p.x += p.vx; p.y += p.vy; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.k; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.a))); cx.restore(); }
    anim = kaw.length ? requestAnimationFrame(rysuj) : 0;
  }
  function balony() {
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('div'); b.className = 'balon';
      b.style.left = (Math.random() * 92) + 'vw'; b.style.background = KOL[i % 5];
      b.style.animationDuration = (9 + Math.random() * 8) + 's'; b.style.animationDelay = (Math.random() * 8) + 's';
      b.style.setProperty('--dx', ((Math.random() - .5) * 120) + 'px'); b.style.setProperty('--r', ((Math.random() - .5) * 40) + 'deg');
      document.body.appendChild(b);
    }
  }

  // ---------- melodia "Happy Birthday" (WebAudio, bez plikow) ----------
  let gra = false;
  function graj() {
    if (gra) return; gra = true;
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const N = { G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784 };
    const M = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2], ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
               ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2], ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
    let t = A.currentTime + .1; const bt = .42;
    for (const [n, d] of M) {
      const o = A.createOscillator(), g = A.createGain(); o.type = 'triangle'; o.frequency.value = N[n];
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d * bt * .95);
      o.connect(g).connect(A.destination); o.start(t); o.stop(t + d * bt); t += d * bt;
    }
    setTimeout(() => { gra = false; A.close(); }, (t - A.currentTime + .3) * 1000);
  }

  // ---------- kartka ----------
  function pokazKartke(imie, wiek, j, od, wlasny) {
    const T = TEKSTY[j] || TEKSTY.pl;
    document.documentElement.lang = j;
    document.title = T.tytul + ', ' + imie + '!';
    $('naglowek').textContent = T.nag + ',';
    $('imie').textContent = imie + '!';
    $('wiek').textContent = wiek ? T.wiek(wiek) : '';
    $('podpisTort').textContent = T.tort;
    $('tekst').textContent = wlasny || T.domyslne;
    $('od').textContent = T.od + od;
    $('graj').textContent = T.muz; $('znowu').textContent = T.znowu;
    // swieczki: tyle co lat (max 10), inaczej 5
    const ile = wiek ? Math.min(Math.max(wiek, 1), 10) : 5, g = $('swieczki'), ns = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < ile; i++) {
      const x = 150 + (i - (ile - 1) / 2) * Math.min(26, 140 / ile);
      g.insertAdjacentHTML('beforeend',
        '<rect x="' + (x - 4) + '" y="58" width="8" height="36" rx="2" fill="' + KOL[i % 5] + '"/>' +
        '<path class="plomien" style="animation-delay:' + (i * .07) + 's" d="M' + x + ' 38 q7 10 0 18 q-7 -8 0 -18z" fill="#ffb703"/>' +
        '<circle class="dym" cx="' + x + '" cy="50" r="4" fill="rgba(255,255,255,.6)"/>');
    }
    $('kartka').classList.remove('ukryj');
    balony(); setTimeout(() => konfetti(160), 300);
    $('tort').addEventListener('click', () => {
      const t = $('tort'); if (t.classList.contains('zgaszone')) { t.classList.remove('zgaszone'); $('podpisTort').textContent = T.tort; return; }
      t.classList.add('zgaszone'); $('podpisTort').textContent = T.zgas; konfetti(220); graj();
    });
    $('graj').onclick = graj;
    $('znowu').onclick = () => konfetti(200);
  }

  // ---------- generator ----------
  function zrobLink() {
    const q = new URLSearchParams();
    const imie = $('gImie').value.trim(); if (!imie) return '';
    q.set('n', imie);
    const w = parseInt($('gWiek').value, 10); if (w > 0 && w < 121) q.set('w', w);
    if ($('gJezyk').value !== 'pl') q.set('j', $('gJezyk').value);
    const od = $('gOd').value.trim(); if (od && od !== 'Adam') q.set('od', od);
    const t = $('gTekst').value.trim(); if (t) q.set('t', t);
    return location.origin + location.pathname + '?' + q.toString();
  }
  function odswiezGen() {
    const l = zrobLink(), box = $('gLink');
    box.style.display = l ? 'block' : 'none'; box.textContent = l;
    const j = $('gJezyk').value, imie = $('gImie').value.trim();
    const zach = j === 'de' ? '🎂 Alles Gute zum Geburtstag, ' + imie + '! Ich habe etwas für Dich: ' : '🎂 Wszystkiego najlepszego, ' + imie + '! Mam coś dla Ciebie: ';
    $('gWhatsapp').href = l ? 'https://wa.me/?text=' + encodeURIComponent(zach + l) : '#';
    try { localStorage.setItem('urodziny_od', $('gOd').value); } catch (e) {}
  }
  function pokazGenerator() {
    $('generator').classList.remove('ukryj');
    try { const o = localStorage.getItem('urodziny_od'); if (o) $('gOd').value = o; } catch (e) {}
    ['gImie', 'gWiek', 'gJezyk', 'gOd', 'gTekst'].forEach(id => $(id).addEventListener('input', odswiezGen));
    $('gJezyk').addEventListener('change', () => { $('gTekst').placeholder = TEKSTY[$('gJezyk').value].domyslne; odswiezGen(); });
    $('gTekst').placeholder = TEKSTY.pl.domyslne;
    $('gPodglad').onclick = () => { const l = zrobLink(); if (!l) { $('gImie').focus(); return; } window.open(l, '_blank'); };
    $('gKopiuj').onclick = async () => {
      const l = zrobLink(); if (!l) { $('gImie').focus(); return; }
      try { await navigator.clipboard.writeText(l); $('gKopiuj').textContent = '✅ Skopiowane'; }
      catch (e) { const r = document.createRange(); r.selectNodeContents($('gLink')); getSelection().removeAllRanges(); getSelection().addRange(r); $('gKopiuj').textContent = '👉 Strg+C'; }
      setTimeout(() => $('gKopiuj').textContent = '📋 Kopiuj link', 2000);
    };
    $('gWhatsapp').addEventListener('click', e => { if (!zrobLink()) { e.preventDefault(); $('gImie').focus(); } });
    odswiezGen();
  }

  const imie = (P.get('n') || '').trim().slice(0, 40);
  if (imie) {
    const w = parseInt(P.get('w'), 10);
    pokazKartke(imie, w > 0 && w < 121 ? w : 0, P.get('j') === 'de' ? 'de' : 'pl', (P.get('od') || 'Adam').slice(0, 40), (P.get('t') || '').slice(0, 600));
  } else pokazGenerator();
})();
</script>
</body>
</html>
