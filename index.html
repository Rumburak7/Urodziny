<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Życzenia</title>
<meta property="og:title" content="🎁 Mam coś dla Ciebie">
<meta property="og:description" content="Życzenia - otwórz!">
<style>
:root{--bg1:#2a1b4d;--bg2:#5b2a6e;--ink:#fff;--soft:#f3e9ff;--acc:#ffd166;--btn:#ff6b9a;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.25)}
body.wn{--bg1:#1f5c4a;--bg2:#7cc49a;--acc:#fff27a;--btn:#ff8fb1;--soft:#f0fff4}
body.bn{--bg1:#0b1530;--bg2:#1f3b6e;--acc:#ffd76a;--btn:#d62839;--soft:#e8f0ff}
body.nr{--bg1:#05060f;--bg2:#251a4a;--acc:#f5d27a;--btn:#7b5cff;--soft:#ece8ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
#efekty{position:fixed;inset:0;pointer-events:none;z-index:3}
.balon{position:fixed;bottom:-140px;width:60px;height:76px;border-radius:50% 50% 48% 48%;opacity:.85;z-index:1;animation:lec linear infinite}
.balon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:60px;background:rgba(255,255,255,.5)}
@keyframes lec{to{transform:translate(var(--dx),-130vh) rotate(var(--r))}}
main{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:28px 16px 40px;text-align:center}
h1{font-size:clamp(30px,8vw,52px);line-height:1.15;margin:8px 0 4px;text-shadow:0 3px 12px rgba(0,0,0,.35)}
h1 .imie{color:var(--acc);display:block}
.wiek{font-size:20px;color:var(--soft);margin:0 0 6px;min-height:4px}
.scena{width:min(300px,80vw);margin:6px auto 0;display:block;cursor:pointer;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));overflow:visible}
/* urodziny */
.plomien{transform-origin:50% 100%;transform-box:fill-box;animation:migaj .5s ease-in-out infinite alternate}
@keyframes migaj{from{transform:scale(1,1)}to{transform:scale(.85,1.12)}}
.zgaszone .plomien{display:none}.zgaszone .dym{display:block}.dym{display:none;animation:dym 1.6s ease-out forwards}
@keyframes dym{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
/* wielkanoc */
.gora{transition:transform .7s cubic-bezier(.3,1.6,.5,1);transform-origin:220px 118px}
.otwarte .gora{transform:translate(34px,-22px) rotate(38deg)}
.kurczak{transition:transform .6s .15s cubic-bezier(.3,1.6,.5,1);transform:translateY(40px)}
.otwarte .kurczak{transform:translateY(-4px)}
.jajo{transform-origin:150px 200px}.scena:not(.otwarte) .jajo{animation:kiwa 2.4s ease-in-out infinite}
@keyframes kiwa{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-5deg)}86%{transform:rotate(5deg)}94%{transform:rotate(-3deg)}}
/* boze narodzenie */
.lampka{fill:#3a3f55;transition:fill .3s}
.swieci .lampka{animation:mrug 1.2s ease-in-out infinite alternate}
@keyframes mrug{from{opacity:1}to{opacity:.35}}
.gwiazda{fill:#7a6a3a;transition:fill .4s,filter .4s}.swieci .gwiazda{fill:#ffd76a;filter:drop-shadow(0 0 10px #ffd76a)}
/* nowy rok */
.kieliszek{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.toast .kl{transform:rotate(14deg) translateX(14px)}.toast .kp{transform:rotate(-14deg) translateX(-14px)}
.kl{transform-origin:110px 200px}.kp{transform-origin:190px 200px}
.podpis{font-size:14px;color:var(--soft);margin:2px 0 14px}
.zyczenia{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;font-size:19px;margin:10px 0 16px;backdrop-filter:blur(4px);white-space:pre-line}
.od{font-size:20px;color:var(--acc);font-weight:700}
.przyciski{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
button,.btn{font:inherit;font-size:16px;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--btn);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);text-decoration:none;display:inline-block}
button.drugi,.btn.drugi{background:rgba(255,255,255,.16);border:1px solid var(--line)}
/* generator */
.okazje{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.okazje button{padding:10px 4px;font-size:13px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid var(--line);box-shadow:none;line-height:1.2}
.okazje button b{display:block;font-size:26px}
.okazje button.wyb{background:var(--btn);border-color:transparent}
.gen{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.gen label{display:block;font-size:14px;color:var(--soft);margin:12px 0 4px}
.gen input,.gen textarea,.gen select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff}
.gen textarea{min-height:90px;resize:vertical}
.gen small{color:var(--soft);font-size:13px}
.link{word-break:break-all;background:rgba(0,0,0,.3);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.wiersz{display:flex;gap:10px}.wiersz>div{flex:1}
footer{font-size:12px;color:rgba(255,255,255,.55);margin-top:26px}
.ukryj{display:none!important}
</style>
</head>
<body>
<canvas id="efekty"></canvas>
<main>
  <section id="kartka" class="ukryj">
    <h1><span id="naglowek"></span><span class="imie" id="imie"></span></h1>
    <p class="wiek" id="wiek"></p>
    <svg class="scena" id="scena" viewBox="0 0 300 230" role="img"></svg>
    <p class="podpis" id="podpisScena"></p>
    <div class="zyczenia" id="tekst"></div>
    <div class="od" id="od"></div>
    <div class="przyciski">
      <button id="graj"></button>
      <button class="drugi" id="znowu"></button>
    </div>
  </section>

  <section id="generator" class="ukryj">
    <h1>🎁 Życzenia<span class="imie">linkiem</span></h1>
    <p class="podpis">Wybierz okazję, wpisz imię, wyślij link - reszta dzieje się sama.</p>
    <div class="gen">
      <div class="okazje" id="gOkazje">
        <button data-o="u" class="wyb"><b>🎂</b>Urodziny</button>
        <button data-o="w"><b>🐣</b>Wielkanoc</button>
        <button data-o="b"><b>🎄</b>Boże Narodzenie</button>
        <button data-o="n"><b>🎆</b>Nowy Rok</button>
      </div>
      <label for="gImie">Imię (tak, jak w życzeniach, np. „Aniu”, „Tomku”, „Kasiu i Marku”)</label>
      <input id="gImie" maxlength="50" placeholder="np. Aniu">
      <div class="wiersz">
        <div id="gWiekBox"><label for="gWiek">Ile lat? (nie musisz)</label><input id="gWiek" type="number" min="1" max="120" placeholder="—"></div>
        <div><label for="gJezyk">Język</label><select id="gJezyk"><option value="pl">Polski</option><option value="de">Deutsch</option></select></div>
      </div>
      <label for="gOd">Od kogo</label>
      <input id="gOd" maxlength="40" value="Adam">
      <label for="gTekst">Własne życzenia (zostaw puste = gotowe życzenia)</label>
      <textarea id="gTekst" maxlength="600"></textarea>
      <small>Gotowe życzenia dopasują się do okazji i języka.</small>
      <div class="przyciski">
        <button id="gPodglad" class="drugi">👀 Podgląd</button>
        <button id="gKopiuj">📋 Kopiuj link</button>
        <a id="gWhatsapp" class="btn" target="_blank" rel="noopener" style="background:#25d366">WhatsApp</a>
      </div>
      <div class="link" id="gLink"></div>
    </div>
  </section>
  <footer>Życzenia - autor Adam Bryks 2026</footer>
</main>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  const teraz = new Date();
  const ROK_NR = teraz.getMonth() >= 9 ? teraz.getFullYear() + 1 : teraz.getFullYear();
  const latPL = (n) => n === 1 ? 'roczek' : n + ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? ' lata' : ' lat');

  // ---------- teksty: okazja -> jezyk ----------
  const O = {
    u: { klasa: '', ikona: '🎂',
      pl: { nag: 'Wszystkiego najlepszego,', wiek: (n) => 'Dziś kończysz ' + latPL(n) + '! 🎈', hint: 'Dotknij tortu, żeby zdmuchnąć świeczki 🎂', po: 'Brawo! Pomyśl życzenie ✨', od: 'Ściskam - ', wa: '🎂 Wszystkiego najlepszego, {imie}! Mam coś dla Ciebie: ',
        txt: 'Z okazji urodzin życzę Ci przede wszystkim zdrowia,\nmnóstwa radości i uśmiechu na co dzień,\nludzi, na których zawsze możesz liczyć,\ni spełnienia wszystkich marzeń - tych małych i tych dużych.\n\nSto lat, sto lat! 🥳' },
      de: { nag: 'Alles Gute zum Geburtstag,', wiek: (n) => 'Heute wirst du ' + n + '! 🎈', hint: 'Tippe auf die Torte, um die Kerzen auszupusten 🎂', po: 'Super! Jetzt was wünschen ✨', od: 'Liebe Grüße - ', wa: '🎂 Alles Gute zum Geburtstag, {imie}! Ich habe etwas für Dich: ',
        txt: 'Zum Geburtstag wünsche ich Dir vor allem Gesundheit,\nviel Freude und jeden Tag einen Grund zum Lächeln,\nMenschen, auf die Du Dich immer verlassen kannst,\nund dass all Deine Wünsche in Erfüllung gehen - die kleinen und die großen.\n\nFeier schön! 🥳' } },
    w: { klasa: 'wn', ikona: '🐣',
      pl: { nag: 'Wesołych Świąt Wielkanocnych,', hint: 'Dotknij pisanki 🥚', po: 'Kto się wykluł? 🐣', od: 'Pozdrawiam serdecznie - ', wa: '🐣 Wesołych Świąt, {imie}! Mam coś dla Ciebie: ',
        txt: 'Zdrowych, pogodnych Świąt Wielkanocnych,\nsmacznego jajka, mokrego dyngusa\ni wiosennej radości w sercu!\n\nWesołego Alleluja! 🌷' },
      de: { nag: 'Frohe Ostern,', hint: 'Tippe auf das Osterei 🥚', po: 'Wer ist da geschlüpft? 🐣', od: 'Liebe Grüße - ', wa: '🐣 Frohe Ostern, {imie}! Ich habe etwas für Dich: ',
        txt: 'Ich wünsche Dir sonnige Ostertage,\nviel Freude beim Eiersuchen,\nleckere Schokohasen\nund einen fröhlichen Frühlingsanfang! 🌷' } },
    b: { klasa: 'bn', ikona: '🎄',
      pl: { nag: 'Wesołych Świąt,', hint: 'Dotknij choinki, żeby zapalić lampki 🎄', po: 'Pięknie świeci! ⭐', od: 'Pozdrawiam serdecznie - ', wa: '🎄 Wesołych Świąt, {imie}! Mam coś dla Ciebie: ',
        txt: 'Spokojnych i radosnych Świąt Bożego Narodzenia,\nciepła rodzinnego, smacznej Wigilii,\nchwili odpoczynku\ni wielu prezentów pod choinką! 🎁' },
      de: { nag: 'Frohe Weihnachten,', hint: 'Tippe auf den Baum, um die Lichter anzumachen 🎄', po: 'Wie schön das leuchtet! ⭐', od: 'Liebe Grüße - ', wa: '🎄 Frohe Weihnachten, {imie}! Ich habe etwas für Dich: ',
        txt: 'Ich wünsche Dir besinnliche Feiertage,\nZeit mit Deinen Liebsten,\nein bisschen Ruhe\nund viele schöne Momente unterm Tannenbaum! 🎁' } },
    n: { klasa: 'nr', ikona: '🎆',
      pl: { nag: 'Szczęśliwego Nowego Roku {rok},', hint: 'Dotknij, żeby odpalić fajerwerki 🎆', po: 'Na zdrowie! 🥂', od: 'Pozdrawiam serdecznie - ', wa: '🎆 Szczęśliwego Nowego Roku, {imie}! Mam coś dla Ciebie: ',
        txt: 'Niech nowy rok przyniesie Ci zdrowie,\nszczęście i spokój,\nmnóstwo dobrych chwil\ni spełnienie wszystkich marzeń.\n\nDo siego roku! 🥂' },
      de: { nag: 'Frohes neues Jahr {rok},', hint: 'Tippe für ein Feuerwerk 🎆', po: 'Prost Neujahr! 🥂', od: 'Liebe Grüße - ', wa: '🎆 Frohes neues Jahr, {imie}! Ich habe etwas für Dich: ',
        txt: 'Für das neue Jahr wünsche ich Dir Gesundheit,\nGlück und Zufriedenheit,\nviele schöne Momente\nund dass all Deine Wünsche in Erfüllung gehen.\n\nGuten Rutsch! 🥂' } }
  };
  const PRZ = { pl: { muz: '🎵 Muzyka', znowu: '🎉 Jeszcze raz' }, de: { muz: '🎵 Musik', znowu: '🎉 Nochmal' } };

  // ---------- efekty na canvas: konfetti / snieg / platki / fajerwerki ----------
  const cv = $('efekty'), cx = cv.getContext('2d'); let cz = [], anim = 0, tryb = '';
  const D = () => devicePixelRatio || 1;
  function rozmiar() { cv.width = innerWidth * D(); cv.height = innerHeight * D(); }
  addEventListener('resize', rozmiar); rozmiar();
  const KOL = ['#ffd166', '#ff6b9a', '#06d6a0', '#4cc9f0', '#f72585', '#ffffff', '#b388ff'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function start() { if (!anim) anim = requestAnimationFrame(klatka); }
  function konfetti(ile) { const d = D(); for (let i = 0; i < ile; i++) cz.push({ t: 'k', x: rnd(0, cv.width), y: -rnd(20, cv.height * .5) * 1, vx: rnd(-1, 1) * d, vy: rnd(2, 5) * d, w: rnd(6, 12) * d, h: rnd(8, 16) * d, a: rnd(0, 6), va: rnd(-.15, .15), k: KOL[(Math.random() * KOL.length) | 0] }); start(); }
  function opad(ile, typ) { const d = D(); for (let i = 0; i < ile; i++) cz.push({ t: typ, x: rnd(0, cv.width), y: -rnd(0, cv.height), vx: rnd(-.4, .4) * d, vy: rnd(.6, 1.8) * d, r: rnd(2, typ === 's' ? 5 : 7) * d, a: rnd(0, 6), k: typ === 's' ? '#ffffff' : ['#ffc8dd', '#fff27a', '#ffffff', '#bde0fe', '#ffafcc'][i % 5] }); start(); }
  function fajerwerk(x, y) { const d = D(), k = KOL[(Math.random() * KOL.length) | 0], n = 70; x = x == null ? rnd(.15, .85) * cv.width : x * d; y = y == null ? rnd(.12, .45) * cv.height : y * d;
    for (let i = 0; i < n; i++) { const kat = i / n * Math.PI * 2, s = rnd(1.5, 4.5) * d; cz.push({ t: 'f', x, y, vx: Math.cos(kat) * s, vy: Math.sin(kat) * s, zycie: 1, k: i % 6 ? k : '#ffffff', r: 2.2 * d }); } start(); }
  function klatka() {
    if (tryb === 'f') { cx.fillStyle = 'rgba(0,0,0,0.18)'; cx.globalCompositeOperation = 'destination-out'; cx.fillRect(0, 0, cv.width, cv.height); cx.globalCompositeOperation = 'source-over'; }
    else cx.clearRect(0, 0, cv.width, cv.height);
    const H = cv.height, W = cv.width;
    cz = cz.filter(p => {
      if (p.t === 'f') { p.x += p.vx; p.y += p.vy; p.vy += .04 * D(); p.vx *= .985; p.vy *= .985; p.zycie -= .011; if (p.zycie <= 0) return false;
        cx.globalAlpha = Math.max(p.zycie, 0); cx.fillStyle = p.k; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); cx.globalAlpha = 1; return true; }
      p.x += p.vx + (p.t === 'k' ? 0 : Math.sin(p.a += .02) * .6); p.y += p.vy;
      if (p.t === 'k') { if (p.y > H + 40) return false; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.k; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.a))); cx.restore(); return true; }
      if (p.y > H + 10) { p.y = -10; p.x = rnd(0, W); }   // snieg i platki leca w kolko
      cx.fillStyle = p.k; cx.globalAlpha = p.t === 's' ? .85 : .9; cx.beginPath();
      if (p.t === 's') cx.arc(p.x, p.y, p.r, 0, 7); else cx.ellipse(p.x, p.y, p.r, p.r * .6, p.a, 0, 7);
      cx.fill(); cx.globalAlpha = 1; return true;
    });
    anim = cz.length ? requestAnimationFrame(klatka) : 0;
  }
  function balony() {
    for (let i = 0; i < 9; i++) { const b = document.createElement('div'); b.className = 'balon';
      b.style.left = rnd(0, 92) + 'vw'; b.style.background = KOL[i % 5]; b.style.animationDuration = rnd(9, 17) + 's'; b.style.animationDelay = rnd(0, 8) + 's';
      b.style.setProperty('--dx', rnd(-60, 60) + 'px'); b.style.setProperty('--r', rnd(-20, 20) + 'deg'); document.body.appendChild(b); }
  }

  // ---------- melodie (WebAudio, bez plikow; wszystkie to stare melodie ludowe / public domain) ----------
  const F = { C4: 262, D4: 294, E4: 330, F4: 349, G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784, C6: 1047 };
  const MEL = {
    u: [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]],
    b: [['E4',1],['E4',1],['E4',2],['E4',1],['E4',1],['E4',2],['E4',1],['G4',1],['C4',1.5],['D4',.5],['E4',4],['F4',1],['F4',1],['F4',1.5],['F4',.5],['F4',1],['E4',1],['E4',1],['E4',.5],['E4',.5],['E4',1],['D4',1],['D4',1],['E4',1],['D4',2],['G4',2]],
    n: [['C4',1],['F4',1.5],['F4',.5],['F4',1],['A4',1],['G4',1.5],['F4',.5],['G4',1],['A4',1],['F4',1.5],['F4',.5],['A4',1],['C5',1],['D5',3]],
    w: [['C5',.5],['E5',.5],['G5',.5],['C6',1],['G5',.5],['E5',.5],['F5',.5],['A4',.5],['C5',.5],['F5',1],['E5',.5],['D5',.5],['G4',.5],['B4',.5],['D5',.5],['G5',1],['F5',.5],['E5',.5],['C5',2]]
  };
  let gra = false;
  function graj(o) {
    if (gra) return; gra = true;
    const A = new (window.AudioContext || window.webkitAudioContext)(); let t = A.currentTime + .1; const bt = o === 'b' ? .32 : .42;
    for (const [n, d] of MEL[o]) { const os = A.createOscillator(), g = A.createGain(); os.type = o === 'b' || o === 'w' ? 'sine' : 'triangle'; os.frequency.value = F[n];
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d * bt * .95); os.connect(g).connect(A.destination); os.start(t); os.stop(t + d * bt); t += d * bt; }
    setTimeout(() => { gra = false; A.close(); }, (t - A.currentTime + .3) * 1000);
  }

  // ---------- sceny SVG ----------
  function scenaTort(sv, wiek) {
    let s = '<ellipse cx="150" cy="212" rx="130" ry="12" fill="rgba(0,0,0,.25)"/><rect x="40" y="130" width="220" height="78" rx="12" fill="#f7a8c4"/>' +
      '<path d="M40 140 q18 22 36 0 q18 22 37 0 q18 22 37 0 q18 22 37 0 q18 22 36 0 q18 22 37 0 v-10 h-220z" fill="#fff4f8"/><rect x="40" y="186" width="220" height="10" fill="#e98bb0"/>' +
      '<rect x="70" y="92" width="160" height="48" rx="10" fill="#ffd9a0"/><path d="M70 100 q13 16 27 0 q13 16 26 0 q13 16 27 0 q13 16 27 0 q13 16 26 0 q13 16 27 0 v-8 h-160z" fill="#fff"/>';
    const ile = wiek ? Math.min(Math.max(wiek, 1), 10) : 5;
    for (let i = 0; i < ile; i++) { const x = 150 + (i - (ile - 1) / 2) * Math.min(26, 140 / ile);
      s += '<rect x="' + (x - 4) + '" y="58" width="8" height="36" rx="2" fill="' + KOL[i % 5] + '"/><path class="plomien" style="animation-delay:' + (i * .07) + 's" d="M' + x + ' 38 q7 10 0 18 q-7 -8 0 -18z" fill="#ffb703"/><circle class="dym" cx="' + x + '" cy="50" r="4" fill="rgba(255,255,255,.6)"/>'; }
    sv.innerHTML = s;
  }
  function scenaJajo(sv) {
    const zyg = '0,118 25,104 50,122 75,104 100,122 125,104 150,122 175,104 200,122 225,104 250,122 275,104 300,118';
    const wzor = '<ellipse cx="150" cy="118" rx="72" ry="92" fill="#ff8fb1"/><path d="M78 92 q18 -14 36 0 t36 0 t36 0 t36 0" stroke="#fff27a" stroke-width="8" fill="none"/>' +
      '<path d="M80 142 l18 -14 18 14 18 -14 18 14 18 -14 18 14 18 -14 18 14" stroke="#7cc4ff" stroke-width="7" fill="none"/><g fill="#fff">' +
      '<circle cx="118" cy="62" r="6"/><circle cx="150" cy="54" r="6"/><circle cx="182" cy="62" r="6"/><circle cx="128" cy="174" r="6"/><circle cx="172" cy="174" r="6"/><circle cx="150" cy="186" r="6"/></g>' +
      '<path d="M78 118 h144" stroke="#fff" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>';
    sv.innerHTML = '<defs><clipPath id="cg"><polygon points="0,0 300,0 ' + zyg.split(' ').reverse().join(' ') + '"/></clipPath><clipPath id="cd"><polygon points="' + zyg + ' 300,230 0,230"/></clipPath></defs>' +
      '<ellipse cx="150" cy="214" rx="96" ry="10" fill="rgba(0,0,0,.25)"/>' +
      '<g class="kurczak"><circle cx="150" cy="104" r="34" fill="#ffd60a"/><circle cx="138" cy="96" r="4" fill="#222"/><circle cx="162" cy="96" r="4" fill="#222"/><path d="M144 108 l6 9 6 -9z" fill="#fb8500"/><path d="M146 70 q4 -12 8 0" stroke="#ffd60a" stroke-width="5" fill="none"/></g>' +
      '<g class="jajo"><g clip-path="url(#cd)">' + wzor + '</g><g class="gora"><g clip-path="url(#cg)">' + wzor + '</g></g></g>' +
      '<g fill="#7bd389"><path d="M30 214 q8 -30 4 -50 q10 20 6 50z"/><path d="M262 214 q-8 -34 -2 -56 q-12 22 -8 56z"/></g><circle cx="34" cy="160" r="9" fill="#fff27a"/><circle cx="260" cy="154" r="9" fill="#ffc8dd"/>';
  }
  function scenaChoinka(sv) {
    let s = '<ellipse cx="150" cy="216" rx="110" ry="10" fill="rgba(0,0,0,.3)"/><rect x="138" y="186" width="24" height="28" fill="#7a4b2a"/>' +
      '<polygon points="150,30 214,110 86,110" fill="#1f7a3f"/><polygon points="150,70 232,160 68,160" fill="#22894a"/><polygon points="150,112 252,198 48,198" fill="#279a52"/>' +
      '<path class="gwiazda" d="M150 6 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z"/>' +
      '<rect x="190" y="180" width="34" height="30" rx="3" fill="#d62839"/><rect x="204" y="180" width="6" height="30" fill="#ffd76a"/><rect x="72" y="188" width="30" height="22" rx="3" fill="#4cc9f0"/><rect x="84" y="188" width="6" height="22" fill="#fff"/>';
    const pkt = [[150, 52], [128, 92], [172, 94], [108, 132], [150, 122], [192, 134], [96, 176], [132, 166], [170, 170], [206, 178], [150, 150]], kol = ['#ff4d6d', '#ffd60a', '#4cc9f0', '#80ffdb', '#ff9e00'];
    pkt.forEach((p, i) => { s += '<circle class="lampka" data-k="' + kol[i % 5] + '" style="animation-delay:' + (i * .17) + 's" cx="' + p[0] + '" cy="' + p[1] + '" r="6"/>'; });
    sv.innerHTML = s;
  }
  function scenaNowyRok(sv, rok) {
    sv.innerHTML = '<g fill="#0e1024"><rect x="0" y="170" width="40" height="60"/><rect x="36" y="140" width="34" height="90"/><rect x="66" y="158" width="30" height="72"/><rect x="200" y="150" width="34" height="80"/><rect x="230" y="128" width="30" height="102"/><rect x="258" y="164" width="42" height="66"/></g>' +
      '<g fill="#f5d27a" opacity=".7"><rect x="44" y="150" width="5" height="6"/><rect x="56" y="166" width="5" height="6"/><rect x="238" y="140" width="5" height="6"/><rect x="246" y="160" width="5" height="6"/><rect x="208" y="166" width="5" height="6"/></g>' +
      '<text x="150" y="70" text-anchor="middle" font-size="58" font-weight="800" fill="#f5d27a" style="font-family:system-ui">' + rok + '</text>' +
      '<g class="kieliszek kl"><path d="M92 100 h36 l-4 44 q-14 10 -28 0z" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="2"/><path d="M96 118 h28 l-2 24 q-12 8 -24 0z" fill="#f5d27a"/><rect x="108" y="150" width="4" height="40" fill="#fff"/><rect x="96" y="188" width="28" height="4" rx="2" fill="#fff"/></g>' +
      '<g class="kieliszek kp"><path d="M172 100 h36 l-4 44 q-14 10 -28 0z" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="2"/><path d="M176 118 h28 l-2 24 q-12 8 -24 0z" fill="#f5d27a"/><rect x="188" y="150" width="4" height="40" fill="#fff"/><rect x="176" y="188" width="28" height="4" rx="2" fill="#fff"/></g>';
  }

  // ---------- kartka ----------
  function pokazKartke(o, imie, wiek, j, od, wlasny, rok) {
    const T = O[o][j], sv = $('scena');
    if (O[o].klasa) document.body.classList.add(O[o].klasa);
    document.documentElement.lang = j;
    const nag = T.nag.replace('{rok}', rok);
    document.title = O[o].ikona + ' ' + nag + ' ' + imie + '!';
    $('naglowek').textContent = nag;
    $('imie').textContent = imie + '!';
    $('wiek').textContent = o === 'u' && wiek ? T.wiek(wiek) : '';
    $('podpisScena').textContent = T.hint;
    $('tekst').textContent = wlasny || T.txt;
    $('od').textContent = T.od + od;
    $('graj').textContent = PRZ[j].muz; $('znowu').textContent = PRZ[j].znowu;
    $('kartka').classList.remove('ukryj');
    const zrobione = () => { $('podpisScena').textContent = T.po; };
    if (o === 'u') { scenaTort(sv, wiek); balony(); setTimeout(() => konfetti(160), 300);
      sv.onclick = () => { if (sv.classList.toggle('zgaszone')) { zrobione(); konfetti(220); graj('u'); } else $('podpisScena').textContent = T.hint; };
      $('znowu').onclick = () => konfetti(200); }
    if (o === 'w') { scenaJajo(sv); opad(45, 'p');
      sv.onclick = () => { if (sv.classList.toggle('otwarte')) { zrobione(); konfetti(90); graj('w'); } else $('podpisScena').textContent = T.hint; };
      $('znowu').onclick = () => { sv.classList.remove('otwarte'); setTimeout(() => sv.onclick(), 350); }; }
    if (o === 'b') { scenaChoinka(sv); opad(110, 's');
      sv.onclick = () => { const on = sv.classList.toggle('swieci'); sv.querySelectorAll('.lampka').forEach(l => l.style.fill = on ? l.dataset.k : ''); if (on) { zrobione(); graj('b'); } else $('podpisScena').textContent = T.hint; };
      $('znowu').onclick = () => opad(60, 's'); }
    if (o === 'n') { tryb = 'f'; scenaNowyRok(sv, rok); let n = 0; const auto = setInterval(() => { fajerwerk(); if (++n > 14) clearInterval(auto); }, 900);
      sv.onclick = () => { sv.classList.add('toast'); setTimeout(() => sv.classList.remove('toast'), 700); zrobione(); for (let i = 0; i < 3; i++) setTimeout(() => fajerwerk(), i * 250); graj('n'); };
      document.addEventListener('click', e => { if (!e.target.closest('button,.scena')) fajerwerk(e.clientX, e.clientY); });
      $('znowu').onclick = () => { for (let i = 0; i < 6; i++) setTimeout(() => fajerwerk(), i * 300); }; }
    $('graj').onclick = () => graj(o);
  }

  // ---------- generator ----------
  let gO = 'u';
  function zrobLink() {
    const q = new URLSearchParams(), imie = $('gImie').value.trim(); if (!imie) return '';
    if (gO !== 'u') q.set('o', gO);
    q.set('n', imie);
    const w = parseInt($('gWiek').value, 10); if (gO === 'u' && w > 0 && w < 121) q.set('w', w);
    if (gO === 'n') q.set('r', ROK_NR);
    if ($('gJezyk').value !== 'pl') q.set('j', $('gJezyk').value);
    const od = $('gOd').value.trim(); if (od && od !== 'Adam') q.set('od', od);
    const t = $('gTekst').value.trim(); if (t) q.set('t', t);
    return location.origin + location.pathname + '?' + q.toString();
  }
  function odswiezGen() {
    const l = zrobLink(), j = $('gJezyk').value;
    $('gLink').style.display = l ? 'block' : 'none'; $('gLink').textContent = l;
    $('gWiekBox').classList.toggle('ukryj', gO !== 'u');
    $('gTekst').placeholder = O[gO][j].txt;
    $('gWhatsapp').href = l ? 'https://wa.me/?text=' + encodeURIComponent(O[gO][j].wa.replace('{imie}', $('gImie').value.trim()) + l) : '#';
    try { localStorage.setItem('zyczenia_od', $('gOd').value); } catch (e) {}
  }
  function pokazGenerator() {
    $('generator').classList.remove('ukryj');
    try { const o = localStorage.getItem('zyczenia_od'); if (o) $('gOd').value = o; } catch (e) {}
    // podpowiedz okazji wg daty
    const m = teraz.getMonth(); gO = m === 11 ? (teraz.getDate() > 26 ? 'n' : 'b') : (m === 0 && teraz.getDate() < 7) ? 'n' : (m === 2 || m === 3) ? 'w' : 'u';
    document.querySelectorAll('#gOkazje button').forEach(b => { b.classList.toggle('wyb', b.dataset.o === gO);
      b.onclick = () => { gO = b.dataset.o; document.querySelectorAll('#gOkazje button').forEach(x => x.classList.toggle('wyb', x === b)); odswiezGen(); }; });
    ['gImie', 'gWiek', 'gOd', 'gTekst'].forEach(id => $(id).addEventListener('input', odswiezGen));
    $('gJezyk').addEventListener('change', odswiezGen);
    $('gPodglad').onclick = () => { const l = zrobLink(); if (!l) { $('gImie').focus(); return; } window.open(l, '_blank'); };
    $('gKopiuj').onclick = async () => {
      const l = zrobLink(); if (!l) { $('gImie').focus(); return; }
      try { await navigator.clipboard.writeText(l); $('gKopiuj').textContent = '✅ Skopiowane'; }
      catch (e) { const r = document.createRange(); r.selectNodeContents($('gLink')); getSelection().removeAllRanges(); getSelection().addRange(r); $('gKopiuj').textContent = '👉 Strg+C'; }
      setTimeout(() => $('gKopiuj').textContent = '📋 Kopiuj link', 2000);
    };
    $('gWhatsapp').addEventListener('click', e => { if (!zrobLink()) { e.preventDefault(); $('gImie').focus(); } });
    odswiezGen();
  }

  const imie = (P.get('n') || '').trim().slice(0, 50);
  if (imie) {
    const o = O[P.get('o')] ? P.get('o') : 'u', w = parseInt(P.get('w'), 10), r = parseInt(P.get('r'), 10);
    pokazKartke(o, imie, w > 0 && w < 121 ? w : 0, P.get('j') === 'de' ? 'de' : 'pl', (P.get('od') || 'Adam').slice(0, 40), (P.get('t') || '').slice(0, 600), r > 2000 && r < 2200 ? r : ROK_NR);
  } else pokazGenerator();
})();
